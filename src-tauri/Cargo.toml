[package]
name = "medd"
version = "0.1.0"
description = "A resident macOS Markdown editor with live side-by-side preview"
authors = ["medd contributors"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.95"

[[bin]]
name = "medd"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
