[package]
name = "medd"
version = "0.1.0"
description = "A resident macOS Markdown editor with live side-by-side preview"
authors = ["medd contributors"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.95"

[[bin]]
name = "medd"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
notify = "8"
notify-debouncer-full = "0.7"
tauri-plugin-single-instance = "2.4.4"
url = "2.5.8"

[dev-dependencies]
tempfile = "3"
